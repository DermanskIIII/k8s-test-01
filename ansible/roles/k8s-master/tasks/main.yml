---
- name: check whether Kubernetes is initialized
  tags: init, init_and_join
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: kubeadm_initialized

- name: init cluster
  tags: init, init_and_join
  ansible.builtin.shell:
    cmd: "kubeadm init --pod-network-cidr=192.168.0.0/16 > /home/ansible/kube_cluster_init.log"
  when: not kubeadm_initialized.stat.exists

- name: get kube config file to local machine (unsecure)
  tags: init, init_and_join
  fetch:
    src: /etc/kubernetes/admin.conf
    dest: /tmp/

- name: add user kube
  tags: setup_kube_user
  ansible.builtin.user:
    name: kube
    state: present
    shell: /usr/bin/bash

- name: create dir .kube at kube user dir
  tags: setup_kube_user
  ansible.builtin.file:
    path: /home/kube/.kube
    state: directory
    owner: kube
    group: kube
    mode: 0700

- name: copy kube admin.conf to kube user .kube dir
  tags: setup_kube_user
  ansible.builtin.copy:
    remote_src: true
    src: /etc/kubernetes/admin.conf
    dest: /home/kube/.kube/config
    owner: kube
    group: kube
    mode: 0700

- name: add env var KUBECONFIG to kube user .profile file
  tags: setup_kube_user
  ansible.builtin.lineinfile:
    path: /home/kube/.profile
    line: KUBECONFIG=$HOME/.kube/config
    insertafter: EOF
    state: present

- name: setup sudo
  tags: setup_kube_user
  ansible.builtin.lineinfile:
    path: /etc/sudoers.d/kube
    create: yes
    state: present
    line: 'kube ALL=(ALL:ALL) NOPASSWD:ALL'

- name: install helm
  tags: helm
  become_user: root
  ansible.builtin.shell:
    cmd: curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
  when: not kubeadm_initialized.stat.exists

- name: add calico helm-repo
  tags: network_setup
  become_user: kube
  ansible.builtin.shell:
    cmd: helm repo add projectcalico https://docs.tigera.io/calico/charts

- name: install calico networking with helm (CRDs)
  tags: network_setup
  become_user: kube
  ansible.builtin.shell:
    cmd: "helm template calico-crds projectcalico/projectcalico.org.v3 --version v3.32.3 --api-versions admissionregistration.k8s.io/v1/MutatingAdmissionPolicy | kubectl apply --server-side -f -"

- name: install calico networking with helm
  tags: network_setup
  become_user: kube
  ansible.builtin.shell:
    cmd: helm install calico projectcalico/tigera-operator --version v3.32.3 --namespace tigera-operator --create-namespace

- name: install nginx-ingress controller with helm
  tags: network_setup
  become_user: kube
  ansible.builtin.shell:
    cmd: "helm install nginx-ingress-controller oci://ghcr.io/nginxinc/charts/nginx-ingress --version 1.0.2 --set-json 'controller.service.externalIPs=[\"{{ ansible_host }}\"]'"

- name: add calico metallb-repo
  tags: network_setup
  become_user: kube
  ansible.builtin.shell:
    cmd: helm repo add metallb https://metallb.github.io/metallb

- name: install metallb with helm
  tags: network_setup
  become_user: kube
  ansible.builtin.shell:
    cmd: helm install metallb metallb/metallb --version 0.16.1 --namespace metallb-system --create-namespace --set speaker.frr.enabled=false --set frrk8s.enabled=false



- name: get join command
  tags: init_and_join, join_workers
  ansible.builtin.shell:
    cmd: "kubeadm token create --print-join-command"
  register: join_command
  when: not kubeadm_initialized.stat.exists
